<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{width:1920px;height:1080px;overflow:hidden;}
  body{font-family:'Inter',sans-serif;color:#eef1f7;position:relative;
    background:radial-gradient(1200px 800px at 80% -8%,rgba(59,111,224,.22),transparent 60%),
      radial-gradient(1000px 760px at 8% 115%,rgba(217,178,91,.22),transparent 60%),
      linear-gradient(160deg,#080a10 0%,#06070b 55%,#040509 100%);}
  .mono{font-family:'JetBrains Mono',monospace;} .display{font-family:'Playfair Display',Georgia,serif;}
  .orb{position:absolute;border-radius:50%;filter:blur(110px);}
  .o1{width:680px;height:680px;top:-220px;left:-160px;background:radial-gradient(circle,rgba(217,178,91,.4),transparent 70%);animation:float 14s ease-in-out infinite;}
  .o2{width:640px;height:640px;bottom:-260px;right:-170px;background:radial-gradient(circle,rgba(59,111,224,.4),transparent 70%);animation:float 18s ease-in-out infinite -6s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-36px,26px) scale(1.05)}}
  .vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 52%,rgba(0,0,0,.55) 100%);}
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}

  .tagline{font-family:'Playfair Display',serif;font-weight:700;font-size:72px;letter-spacing:-1px;opacity:0;}
  .tagline .gold{font-style:italic;background:linear-gradient(100deg,#f3d998,#d9b25b 45%,#b98f3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  /* like / comment / share CTA row */
  .cta{display:flex;gap:28px;margin-top:52px;opacity:0;}
  .cta .pill{display:flex;align-items:center;gap:14px;padding:20px 34px;border-radius:18px;font-size:26px;font-weight:600;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);}
  .cta .pill svg{width:30px;height:30px;}
  .cta .like{color:#f3d998;border-color:rgba(217,178,91,.35);} .cta .like svg{stroke:#f3d998;}
  .cta .comment{color:#6f93e6;border-color:rgba(59,111,224,.35);} .cta .comment svg{stroke:#6f93e6;}
  .cta .share{color:#3ee089;border-color:rgba(47,210,122,.35);} .cta .share svg{stroke:#3ee089;}

  .divider{width:420px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,178,91,.5),transparent);margin:56px 0 40px;opacity:0;}

  .built{font-size:30px;color:#c3cad8;opacity:0;}
  .built b{font-family:'Playfair Display',serif;font-style:italic;color:#f3d998;font-weight:700;}
  .socials{display:flex;gap:20px;margin-top:26px;opacity:0;}
  .socials a{display:flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#f3d998;
    border:1px solid rgba(217,178,91,.3);background:rgba(217,178,91,.08);text-decoration:none;}
  .socials svg{width:22px;height:22px;stroke:#d9b25b;}
  .brand{position:absolute;left:70px;bottom:50px;z-index:3;display:flex;align-items:center;gap:14px;opacity:0;}
  .brand .txt{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:34px;} .brand .txt .g{color:#f3d998;}
  .tags{position:absolute;right:70px;bottom:52px;z-index:3;font-family:'JetBrains Mono',monospace;font-size:20px;color:#d9b25b;text-align:right;line-height:1.7;opacity:0;}
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="vig"></div><div class="grain"></div>

  <div class="wrap">
    <div class="tagline">Bedrock writes the words. <span class="gold">Decider makes the call.</span></div>

    <div class="cta">
      <div class="pill like">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
        Like
      </div>
      <div class="pill comment">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Comment
      </div>
      <div class="pill share">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51 8.59 10.49"/></svg>
        Share
      </div>
    </div>

    <div class="divider"></div>

    <div class="built">Built by <b>Sarvar Nadaf</b> · Cloud Architect</div>
    <div class="socials">
      <a><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>sarvarnadaf.com</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>github.com/simplynadaf</a>
      <a><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>linkedin.com/in/sarvar04</a>
    </div>
  </div>

  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9b25b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V9l7-4 7 4v12"/><path d="M12 5v16" stroke="#f3d998"/><path d="M3 21h18"/></svg>
    <div class="txt">The <span class="g">Checkpoint</span></div>
  </div>
  <div class="tags">#strands-decider-2b<br>#policy</div>

<script>
  const tl = gsap.timeline();
  tl.to('.tagline',{opacity:1,y:0,duration:.8,ease:'power3.out',startAt:{y:28}})
    .to('.cta',{opacity:1,y:0,duration:.6,ease:'power2.out',startAt:{y:20}},'-=0.3')
    .from('.cta .pill',{scale:.85,stagger:.1,duration:.4,ease:'back.out(2)'},'-=0.4')
    .to('.divider',{opacity:1,width:420,duration:.6,ease:'power1.inOut'},'-=0.1')
    .to('.built',{opacity:1,y:0,duration:.5,ease:'power2.out',startAt:{y:14}},'-=0.1')
    .to('.socials',{opacity:1,y:0,duration:.6,ease:'power2.out',startAt:{y:16}},'-=0.2')
    .from('.socials a',{opacity:0,y:10,stagger:.12,duration:.4},'-=0.4')
    .to('.brand',{opacity:1,duration:.5},'-=0.3')
    .to('.tags',{opacity:1,duration:.5},'-=0.4');
  window.__outroReady = true;
</script>
</body>
</html>
